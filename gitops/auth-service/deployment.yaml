# Este arquivo e atualizado automaticamente pelo pipeline de CI (job
# "update-gitops" em .github/workflows/_reusable-service-ci.yml), que troca
# a linha `image:` pela tag com o hash do commit apos build+push no ECR.
# O ArgoCD monitora este arquivo e sincroniza a mudanca no cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: toogle-master
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 304368728585.dkr.ecr.us-east-1.amazonaws.com/auth-service:v1.0.0-c53380c
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: MASTER_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
