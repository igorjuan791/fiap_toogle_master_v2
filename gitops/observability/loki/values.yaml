# Loki - Fase 4 (ToggleMaster)
# Modo SingleBinary + filesystem: o modo distribuido e pesado demais para o cluster do Academy,
# e storage em S3 exigiria IAM extra que a LabRole nao permite criar.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true   # necessario para receber logs via OTLP (/otlp)
    volume_enabled: true
    retention_period: 48h
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: false   # sem EBS CSI driver: usa emptyDir. Nao reinicie o pod do Loki durante a gravacao.
  extraVolumes:
    - name: data
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki   # o rootfs e read-only e o chart nao monta nada aqui sem persistence
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# zera os componentes do modo distribuido / simple scalable
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }

gateway: { enabled: false }
minio: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
monitoring:
  selfMonitoring: { enabled: false, grafanaAgent: { installOperator: false } }
  lokiCanary: { enabled: false }
