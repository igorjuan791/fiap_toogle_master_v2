name: targeting-service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "services/targeting-service/**"
      - "docker/Dockerfile.targeting"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/_reusable-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/targeting-service/**"
      - "docker/Dockerfile.targeting"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/_reusable-service-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service_name: targeting-service
      service_path: services/targeting-service
      dockerfile: docker/Dockerfile.targeting
      language: python
      port: "8003"
      gitops_path: gitops/targeting-service/deployment.yaml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
