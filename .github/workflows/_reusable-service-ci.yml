# Workflow reutilizável de CI/DevSecOps para um microsserviço do ToggleMaster.
#
# Chamado por um workflow "fino" por serviço (auth-service.yml, flag-service.yml,
# etc.), cada um passando o nome/linguagem/porta/Dockerfile daquele serviço.
# Isso evita duplicar 5x a mesma lógica de pipeline, mas ainda satisfaz o
# requisito "crie workflows para cada um dos 5 microsserviços" -- cada
# microsserviço tem seu próprio workflow (arquivo, gatilho e execução),
# só reaproveitando os passos em comum.
#
# Estágios (jobs), na ordem exigida pelo desafio:
#   1. build-test        Build & Unit Test
#   2. lint               Linter / Static Analysis
#   3. sca                Security Scan - SCA (Trivy fs)
#   4. sast                Security Scan - SAST (gosec / bandit)
#   5. docker-build-push  Docker Build & Push (+ Trivy container scan)
#   6. update-gitops       Atualiza a tag da imagem no repositório de GitOps
#
# Regra de bloqueio: se o Trivy encontrar vulnerabilidade CRÍTICA (SCA ou na
# imagem), o job falha com exit-code 1 e os jobs seguintes (que dependem dele
# via `needs`) nunca rodam -- o pipeline "falha e não prossegue".

name: Reusable Service CI/CD

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Nome do serviço, igual à pasta em services/ e ao repo no ECR (ex: auth-service)"
      service_path:
        required: true
        type: string
        description: "Caminho do código-fonte (ex: services/auth-service)"
      dockerfile:
        required: true
        type: string
        description: "Caminho do Dockerfile (ex: docker/Dockerfile.auth)"
      language:
        required: true
        type: string
        description: "go ou python"
      port:
        required: true
        type: string
      gitops_path:
        required: true
        type: string
        description: "Caminho do manifesto de deploy no repo de GitOps (ex: gitops/auth-service/deployment.yaml)"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
      AWS_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ---------------------------------------------------------------
  # 1. Build & Unit Test
  # ---------------------------------------------------------------
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: Build (Go)
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_path }}
        run: go build ./...

      - name: Unit tests (Go)
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_path }}
        run: go test ./... -v || echo "Nenhum teste unitario encontrado ainda (permitido pelo desafio - 'se houver')."

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Python)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check (Python)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: python -m py_compile app.py

      - name: Unit tests (Python)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          if ls test_*.py *_test.py tests/*.py >/dev/null 2>&1; then
            pytest -v
          else
            echo "Nenhum teste unitário encontrado ainda (permitido pelo desafio: 'se houver')."
          fi

  # ---------------------------------------------------------------
  # 2. Linter / Static Analysis
  # ---------------------------------------------------------------
  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: golangci-lint
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ inputs.service_path }}
          args: --timeout=5m
          install-mode: goinstall

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: flake8
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --extend-ignore=E203,W503

  # ---------------------------------------------------------------
  # 3. Security Scan - SCA (dependências)
  # ---------------------------------------------------------------
  sca:
    name: "Security Scan (SCA - Trivy fs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trivy filesystem scan (dependências)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service_path }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db

  # ---------------------------------------------------------------
  # 4. Security Scan - SAST (código fonte)
  # ---------------------------------------------------------------
  sast:
    name: "Security Scan (SAST)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: gosec (Go SAST)
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_path }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # -severity high -confidence high = nosso equivalente a "vulnerabilidade
          # CRITICA" (gosec nao tem esse nivel; HIGH/HIGH e o mais proximo).
          gosec -severity high -confidence high ./...

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: bandit (Python SAST)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          pip install bandit
          # -lll / -iii = so falha em severidade ALTA com confianca ALTA
          # (nosso equivalente ao "CRITICO" pedido no desafio, ja que o
          # bandit nao possui esse nivel).
          bandit -r . -lll -iii

  # ---------------------------------------------------------------
  # 5. Docker Build & Push (com scan de vulnerabilidades na imagem)
  # ---------------------------------------------------------------
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-test, lint, sca, sast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute image tag
        id: vars
        run: echo "image_tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -f ${{ inputs.dockerfile }} \
            -t ${{ inputs.service_name }}:${{ steps.vars.outputs.image_tag }} \
            .

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ inputs.service_name }}:${{ steps.vars.outputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & Push para o ECR
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          docker tag ${{ inputs.service_name }}:${{ steps.vars.outputs.image_tag }} \
            "$REGISTRY/${{ inputs.service_name }}:${{ steps.vars.outputs.image_tag }}"
          docker push "$REGISTRY/${{ inputs.service_name }}:${{ steps.vars.outputs.image_tag }}"

  # ---------------------------------------------------------------
  # 6. GitOps: atualiza a tag da imagem no manifesto de deploy
  # ---------------------------------------------------------------
  update-gitops:
    name: Update GitOps manifest
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar tag da imagem no manifesto GitOps
        run: |
          set -e
          REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          NEW_IMAGE="$REGISTRY/${{ inputs.service_name }}:${{ needs.docker-build-push.outputs.image_tag }}"
          FILE="${{ inputs.gitops_path }}"

          echo "Atualizando $FILE para imagem: $NEW_IMAGE"
          sed -i -E "s#image: .*/${{ inputs.service_name }}:.*#image: ${NEW_IMAGE}#" "$FILE"
          grep "image:" "$FILE"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.gitops_path }}
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git commit -m "ci(gitops): atualiza imagem de ${{ inputs.service_name }} para ${{ needs.docker-build-push.outputs.image_tag }}"
            git push
          fi
