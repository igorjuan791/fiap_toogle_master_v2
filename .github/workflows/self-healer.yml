name: self-healer CI/CD

on:
  push:
    branches: [main]
    paths:
      - "self-healer/**"
      - ".github/workflows/self-healer.yml"
      - ".github/workflows/_reusable-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "self-healer/**"
      - ".github/workflows/self-healer.yml"
      - ".github/workflows/_reusable-service-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service_name: self-healer
      service_path: self-healer
      dockerfile: self-healer/Dockerfile
      language: python
      port: "8080"
      gitops_path: gitops/observability/config/self-healer.yaml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
