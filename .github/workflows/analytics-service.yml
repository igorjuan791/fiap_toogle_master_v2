name: analytics-service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "services/analytics-service/**"
      - "docker/Dockerfile.analytics"
      - ".github/workflows/analytics-service.yml"
      - ".github/workflows/_reusable-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/analytics-service/**"
      - "docker/Dockerfile.analytics"
      - ".github/workflows/analytics-service.yml"
      - ".github/workflows/_reusable-service-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service_name: analytics-service
      service_path: services/analytics-service
      dockerfile: docker/Dockerfile.analytics
      language: python
      port: "8005"
      gitops_path: gitops/analytics-service/deployment.yaml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
